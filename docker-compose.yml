# Deployment stack: runs published images, builds nothing.
#
#   docker compose up -d
#
# This file is for running metaedit, not for changing it. It pulls the app image
# from GHCR and builds nothing at all -- there is no `build:` key here on
# purpose, so `docker compose up` cannot silently fall back to compiling the
# local checkout. Working on the code? Use docker-compose.dev.yml.
#
# Which image you get:
#
#   METAEDIT_IMAGE=ghcr.io/sredevopsorg/metaedit:main    (default)
#
# `main` tracks the unreleased edge; it is rebuilt on every push that changes
# the image. For a fixed version pin a release tag instead, e.g. :0.3.0 or
# :latest. See docs/operations.md for what each tag means and why `latest`
# only moves on a release.

name: metaedit

x-app-image: &app-image
  image: ${METAEDIT_IMAGE:-ghcr.io/sredevopsorg/metaedit:main}

services:
  postgres:
    image: docker.io/postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metaedit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metaedit}
      POSTGRES_DB: ${POSTGRES_DB:-metaedit}
      # Deterministic initdb so collation cannot drift under the archive.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=en-US"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
    volumes:
      # Postgres 18+ images store data in a major-version-specific subdirectory
      # (compatible with pg_upgrade --link), so the mount point is the parent
      # directory, not /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metaedit} -d ${POSTGRES_DB:-metaedit}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # Forward-only migrations run as their own idempotent step, never implicitly
  # at application startup on every replica. It runs the same published image,
  # with alembic instead of uvicorn as the command.
  migrate:
    <<: *app-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metaedit}:${POSTGRES_PASSWORD:-metaedit}@postgres:5432/${POSTGRES_DB:-metaedit}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    <<: *app-image
    # The app only starts once migrations have succeeded, so a failed migration
    # leaves the old container running rather than a half-migrated one serving.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metaedit}:${POSTGRES_PASSWORD:-metaedit}@postgres:5432/${POSTGRES_DB:-metaedit}
      JELLYFIN_URL: ${JELLYFIN_URL:-http://host.docker.internal:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      # Empty means "use the app's built-in default", which carries the project
      # URL and version. Pinning a version here would drift from the image.
      LASTFM_USER_AGENT: ${LASTFM_USER_AGENT:-}
      ARCHIVE_SOFT_CAP_BYTES: ${ARCHIVE_SOFT_CAP_BYTES:-104857600}
      LASTFM_MAX_RPS: ${LASTFM_MAX_RPS:-4}
      LOG_JSON: ${LOG_JSON:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_DIST_DIR: /app/web
    ports:
      # Bind to loopback by default: the app holds an admin Jellyfin key and has
      # no multi-user auth of its own.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
